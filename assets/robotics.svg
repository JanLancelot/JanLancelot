<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title">
<title id="title">Robotics mission log, World Robot Olympiad Future Engineers: 2021 World Robot Olympiad, 8th place; 2022 Philippine Robotics Olympiad, 1st place; 2022 WRO Germany in Dortmund, represented the Philippines</title>
<defs>
