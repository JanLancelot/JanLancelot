  <text x="300" y="112" font-size="15" fill="#cbd5e1" clip-path="url(#msg)">Thanks for stopping by, human. Transmission complete.</text>
  <text x="300" y="140" font-size="12" letter-spacing="3" fill="#475569">BEEP · BOOP · JLM-01 SIGNING OFF</text>
